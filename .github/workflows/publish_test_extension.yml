name: "[CI] Publish Test Extension"

on:
  push:
    branches: [develop, "release/*"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build the test-extension from"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
      title:
        description: "Release title"
        required: true
        type: string

env:
  FORCE_COLOR: "1"

jobs:
  publish-extension:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_name == 'develop' && 'develop-latest' || format('{0}-latest', github.ref_name)) }}
      RELEASE_TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.title || (github.ref_name == 'develop' && 'Test Extension (develop)' || format('Test Extension ({0})', github.ref_name)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: ./.github/actions/setup-action-composite

      - name: Build extension zip
        run: pnpm nx run @ledgerhq/test-extension:buildZip

      - name: Delete existing release
        run: gh release delete "${{ env.RELEASE_TAG }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with extension zip
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            apps/test-extension/test-extension.zip \
            --title "${{ env.RELEASE_TITLE }}" \
            --notes "Latest test extension build from ${{ env.RELEASE_REF }} branch.

          **Commit:** ${{ github.sha }}
          **Updated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
