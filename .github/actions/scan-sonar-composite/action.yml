name: "SonarCloud Analysis"
description: "Checkout, optionally download coverage artifact, and run SonarCloud scan"

inputs:
  ref:
    description: "Git ref to checkout (defaults to the current commit)"
    required: false
    default: ""
  should_download_coverage:
    description: "Download coverage artifact from a prior unit-testing job"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        fetch-depth: 0

    - name: Download unit test coverage
      if: ${{ inputs.should_download_coverage == 'true' }}
      uses: actions/download-artifact@v7
      with:
        name: coverage
        path: packages

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
