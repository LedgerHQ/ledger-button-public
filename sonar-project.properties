sonar.projectKey=LedgerHQ_ledger-button
sonar.organization=ledgerhq

# Only analyze the two publishable packages, not test apps or tooling
sonar.sources=packages/ledger-button/src,packages/ledger-button-core/src

# Treat spec/test files as tests (not production code)
sonar.tests=packages/ledger-button/src,packages/ledger-button-core/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclude non-meaningful files from source analysis:
# - test / story files
# - tooling & build config (eslint, vite, tailwind, tsconfig, etc.)
# - generated i18n JSONs
# - build outputs, type declarations, barrels
sonar.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.stories.ts,\
  **/*.stories.tsx,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/eslint.config.*,\
  **/vite.config.*,\
  **/tailwind.config.*,\
  **/postcss.config.*,\
  **/scope-css-variables.js,\
  **/tsconfig*.json,\
  **/project.json,\
  **/package.json,\
  **/*.d.ts,\
  **/index.ts,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/test-output/**,\
  **/node_modules/**,\
  packages/ledger-button/src/i18n/**

# Exclude the same non-meaningful files from coverage so they don't skew metrics
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.stories.ts,\
  **/*.stories.tsx,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/eslint.config.*,\
  **/vite.config.*,\
  **/tailwind.config.*,\
  **/postcss.config.*,\
  **/scope-css-variables.js,\
  **/*.d.ts,\
  **/index.ts,\
  packages/ledger-button/src/i18n/**

# Exclude repetitive/generated files from duplicate-code detection
sonar.cpd.exclusions=\
  **/*.config.js,\
  **/*.config.cjs,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/eslint.config.*,\
  **/vite.config.*,\
  **/tailwind.config.*,\
  **/*.d.ts,\
  **/index.ts,\
  packages/ledger-button/src/i18n/**

# Coverage reports (lcov format generated by vitest v8)
sonar.javascript.lcov.reportPaths=\
  packages/ledger-button/test-output/vitest/coverage/lcov.info,\
  packages/ledger-button-core/test-output/vitest/coverage/lcov.info

sonar.sourceEncoding=UTF-8
